services:
  db:
    image: postgres:16-alpine
    container_name: acessstack_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acessstack}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-acessstack}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: acessstack_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-acessstack}?schema=public
      PORT: ${BACKEND_PORT:-3001}
      # Valores padrao servem so para desenvolvimento local. Para qualquer
      # ambiente exposto, defina essas variaveis num arquivo .env ao lado deste
      # compose (veja .env.example na raiz).
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@acessstack.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MASTER_EMAIL: ${MASTER_EMAIL:-owner@acessstack.local}
      MASTER_PASSWORD: ${MASTER_PASSWORD:-}
      GATE_EMAIL: ${GATE_EMAIL:-operator@acessstack.local}
      GATE_PASSWORD: ${GATE_PASSWORD:-}
      SCANNER_EMAIL: ${SCANNER_EMAIL:-scanner@acessstack.local}
      SCANNER_PASSWORD: ${SCANNER_PASSWORD:-}
      GOVERNANCE_EMAIL: ${GOVERNANCE_EMAIL:-governance@acessstack.local}
      GOVERNANCE_PASSWORD: ${GOVERNANCE_PASSWORD:-}
      GATE_START_HOUR: ${GATE_START_HOUR:-0}
      GATE_END_HOUR: ${GATE_END_HOUR:-23}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - backup_data:/app/backups

  frontend:
    build:
      context: ./frontend
    container_name: acessstack_frontend
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-3001}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

volumes:
  postgres_data:
  backup_data:
